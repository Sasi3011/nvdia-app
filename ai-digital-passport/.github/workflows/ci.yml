name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-lint-typecheck-build:
    runs-on: ubuntu-latest
    env:
      # Placeholder values so build-time env access (Prisma generate, etc.)
      # doesn't fail in CI. No deploy step / real infra yet.
      DATABASE_URL: "postgresql://adp:adp@localhost:5432/ai_digital_passport?schema=public"
      REDIS_URL: "redis://localhost:6379"
      PORT: "4000"
      WEB_ORIGIN: "http://localhost:3000"
      GOOGLE_CALLBACK_URL: "http://localhost:4000/auth/google/callback"
      SESSION_SECRET: "ci-placeholder-secret"
      ALLOWED_EMAIL_DOMAIN: "sece.ac.in"
      GOOGLE_CLIENT_ID: "ci-placeholder"
      GOOGLE_CLIENT_SECRET: "ci-placeholder"
      AWS_S3_BUCKET: "ci-placeholder"
      AWS_REGION: "ap-south-1"
      API_BASE_URL: "http://localhost:4000"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
